name: Tests

on:
  push:
  pull_request:
  schedule:
    # Weekly, to catch breaking changes in new Home Assistant releases.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components/moen_smart_faucet

  tests:
    name: tests (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported release (hacs.json "homeassistant").
          - ha: "2026.9.2"
            harness: "0.13.365"
            pytest-args: ""
          # Latest pinned release; coverage is measured here.
          - ha: "2026.10.0"
            harness: "0.13.371"
            pytest-args: "--cov=custom_components.moen_smart_faucet --cov-report=term-missing"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install pytest-homeassistant-custom-component==${{ matrix.harness }} pyyaml
      - run: pytest ${{ matrix.pytest-args }}

  # Early warning for new Home Assistant releases; doesn't fail the build.
  # Snapshots are pinned to a release, so they're skipped here.
  tests-latest:
    name: tests (latest Home Assistant, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --upgrade pytest-homeassistant-custom-component pyyaml
      - run: pytest --deselect tests/test_snapshots.py
